// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        // NOTE: The Google Services (GMS) classpath that Capacitor adds by
        // default is REMOVED on purpose. Folio uses ZERO Google services, so a
        // plain APK installs on any Android device including Huawei (HMS). No
        // Firebase, no Play Services, no analytics — anywhere in the build.

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
